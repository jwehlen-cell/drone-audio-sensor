org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Build-time provisioning. These are read by app/build.gradle.kts and
# baked into BuildConfig constants. DroneSensorApplication.onCreate
# applies them to SharedPreferences exactly once via ProvisioningPayload,
# the same shape a QR scanner will produce in the future.
#
# The current values point a brand-new emulator install at the argosuat
# dev gateway, register it as PHONE-PATRICK-001, and tag it to the
# Patrick site (which must already exist in the Firestore device
# registry — see scripts/backfill_device_sites.py / the inline
# pre-registration step in the run-book).
#
# To re-provision the emulator for a different site, either edit these
# values + reinstall, or pass `-P<key>=value` overrides at build time
# (./gradlew :app:installDebug -Psite=Shaw -PdeviceId=PHONE-SHAW-001 ...).
grpcHost=drone-sensor-dev-gateway-ps5izj4jxq-wl.a.run.app
grpcPort=443
tls=true
site=Patrick
siteLabel=Patrick (emulator)
deviceId=PHONE-PATRICK-001
jwtAudience=
