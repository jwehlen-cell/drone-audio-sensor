# Cloud Build config for the admin web UI.
#
# Build + push only. The admin Cloud Run service does NOT have
# ignore_changes on its image (rapid R&D iteration), so Terraform owns
# the deploy. The flow is:
#
#   1. `make build-admin` runs this config → pushes :<sha> and :latest
#      to Artifact Registry.
#   2. `make deploy-admin` calls (1) and then `terraform apply` with
#      `admin_image` pinned to :<sha> so Terraform rolls a new Cloud
#      Run revision.
substitutions:
  _REPO:        us-central1-docker.pkg.dev/drone-audio-sensor/drone-sensor-images-dev
  _TAG:         latest

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/admin/Dockerfile
      - -t
      - ${_REPO}/admin:${_TAG}
      - -t
      - ${_REPO}/admin:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REPO}/admin

images:
  - ${_REPO}/admin:${_TAG}
  - ${_REPO}/admin:latest
